<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketers Unmuted CRM</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail">
      <a class="brand" href="#dashboard" aria-label="Marketers Unmuted CRM home">
        <img src="assets/logo-wordmark.png" alt="Marketers Unmuted">
      </a>
      <nav id="nav" aria-label="Main"></nav>
      <div class="rail-foot">
        <img src="assets/mu-badge.png" alt="" width="36" height="36">
        <div>
          <strong>CanadianSME Media Group</strong>
          <span>Phase 1 · demo</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="globalSearch" type="search" placeholder="Search people, companies, associations" autocomplete="off">
        </label>
        <div class="search-results" id="searchResults" hidden></div>
        <div class="me" title="Signed in (demo)">R</div>
      </header>

      <div class="demo-banner" id="demoBanner">
        Demo data only. Every person and company here is invented so you can review the design.
        <button class="link-btn" id="resetDemo">Reset demo data</button>
      </div>

      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Details"></aside>
  <dialog class="modal" id="modal"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
